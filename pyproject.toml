[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-free"
version = "0.1.0"
description = "Local, private, fast speech-to-text for Windows with grammar correction (pt-BR), optimized for RTX 3060 12GB."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Whisper Free" }]
keywords = ["whisper", "speech-to-text", "dictation", "cuda", "grammar", "pt-BR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.2.0",
    "ctranslate2>=4.5.0",
    "language-tool-python>=3.2.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "black>=24.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
gpu = [
    # CUDA 12 runtime shipped as wheels: no system-wide CUDA Toolkit needed.
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1; sys_platform == 'win32'",
]
gpu-cleanup = [
    # Optional: enables torch.cuda.empty_cache() for stricter VRAM release.
    "torch>=2.3.0",
]

[project.scripts]
whisper-free = "whisper_free.main:cli_entry"

[project.urls]
Homepage = "https://github.com/your-user/whisper-free"

[tool.setuptools.packages.find]
where = ["src"]

# ==============================================================================
# Tooling configuration
# ==============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-ra", "-q", "-m", "not integration and not gpu"]
markers = [
    "integration: tests that use real models/audio (slow)",
    "gpu: tests that require a CUDA GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
